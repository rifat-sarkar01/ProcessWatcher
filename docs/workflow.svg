<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="100%" stop-color="#121923"/>
    </linearGradient>
    <linearGradient id="samGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="wonderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5A524"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="imageGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EA8FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="outputGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B7189"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="1050" fill="url(#bgGrad)" rx="16"/>

  <!-- Title -->
  <text x="700" y="50" text-anchor="middle" fill="#E6EDF3" font-size="28" font-weight="700" letter-spacing="1">Process Watcher — Pipeline Workflow</text>
  <text x="700" y="76" text-anchor="middle" fill="#9FB0C3" font-size="14" font-weight="400">"Not what the paperwork says: what actually happened."</text>

  <!-- Legend -->
  <g transform="translate(50, 95)">
    <rect x="0" y="0" width="1300" height="34" rx="8" fill="#1A2430" stroke="#2A3A4D" stroke-width="1"/>
    <circle cx="30" cy="17" r="7" fill="url(#samGrad)"/>
    <text x="46" y="22" fill="#E6EDF3" font-size="12" font-weight="500">SAM 3.1</text>
    <circle cx="160" cy="17" r="7" fill="url(#wonderGrad)"/>
    <text x="176" y="22" fill="#E6EDF3" font-size="12" font-weight="500">Muse Wonder</text>
    <circle cx="320" cy="17" r="7" fill="url(#imageGrad)"/>
    <text x="336" y="22" fill="#E6EDF3" font-size="12" font-weight="500">Muse Image</text>
    <circle cx="470" cy="17" r="7" fill="url(#coreGrad)"/>
    <text x="486" y="22" fill="#E6EDF3" font-size="12" font-weight="500">Core Engine</text>
    <circle cx="610" cy="17" r="7" fill="url(#outputGrad)"/>
    <text x="626" y="22" fill="#E6EDF3" font-size="12" font-weight="500">Output</text>
    <rect x="750" y="8" width="50" height="18" rx="4" fill="none" stroke="#5B7189" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="810" y="22" fill="#9FB0C3" font-size="12">Deterministic</text>
    <rect x="930" y="8" width="50" height="18" rx="4" fill="none" stroke="#5B7189" stroke-width="1.5"/>
    <text x="990" y="22" fill="#9FB0C3" font-size="12">Model-assisted</text>
  </g>

  <!-- INPUT SECTION -->
  <g transform="translate(50, 155)">
    <text x="0" y="18" fill="#9FB0C3" font-size="12" font-weight="600" letter-spacing="2">INPUT</text>
    <rect x="0" y="30" width="180" height="70" rx="10" fill="#1A2430" stroke="#2A3A4D" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="90" y="60" text-anchor="middle" fill="#E6EDF3" font-size="15" font-weight="600">📹 Video</text>
    <text x="90" y="80" text-anchor="middle" fill="#9FB0C3" font-size="11">mp4/mov/webm/mkv</text>
    <rect x="210" y="30" width="180" height="70" rx="10" fill="#1A2430" stroke="#2A3A4D" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="300" y="60" text-anchor="middle" fill="#E6EDF3" font-size="15" font-weight="600">📋 SOP</text>
    <text x="300" y="80" text-anchor="middle" fill="#9FB0C3" font-size="11">md / txt / pdf</text>
  </g>

  <!-- INGEST -->
  <g transform="translate(480, 185)">
    <rect x="0" y="0" width="170" height="70" rx="10" fill="#1A2430" stroke="url(#coreGrad)" stroke-width="2" filter="url(#shadow)"/>
    <text x="85" y="30" text-anchor="middle" fill="#6EA8FF" font-size="13" font-weight="600">① Ingest</text>
    <text x="85" y="50" text-anchor="middle" fill="#9FB0C3" font-size="10">CFR • 720p • sha256</text>
    <text x="85" y="63" text-anchor="middle" fill="#9FB0C3" font-size="10">PTS time map</text>
  </g>

  <!-- Arrow: Video to Ingest -->
  <line x1="230" y1="220" x2="478" y2="220" stroke="#5B7189" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SOP COMPILE -->
  <g transform="translate(480, 270)">
    <rect x="0" y="0" width="170" height="70" rx="10" fill="#1A2430" stroke="url(#wonderGrad)" stroke-width="2" filter="url(#shadow)"/>
    <text x="85" y="30" text-anchor="middle" fill="#F5A524" font-size="13" font-weight="600">② SOP Compile</text>
    <text x="85" y="50" text-anchor="middle" fill="#9FB0C3" font-size="10">step_graph.json</text>
    <text x="85" y="63" text-anchor="middle" fill="#9FB0C3" font-size="10">SAM vocabulary</text>
  </g>

  <!-- Arrow: SOP to Compile -->
  <line x1="390" y1="240" x2="425" y2="240" stroke="#5B7189" stroke-width="1.5"/>
  <line x1="425" y1="240" x2="425" y2="305" stroke="#5B7189" stroke-width="1.5"/>
  <line x1="425" y1="305" x2="478" y2="305" stroke="#5B7189" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- PERCEPTION SECTION -->
  <g transform="translate(50, 370)">
    <rect x="0" y="0" width="580" height="200" rx="14" fill="none" stroke="#22D3EE" stroke-width="1" stroke-dasharray="6 4" opacity="0.3"/>
    <text x="16" y="22" fill="#22D3EE" font-size="12" font-weight="600" letter-spacing="2" opacity="0.7">PERCEPTION</text>
    <rect x="20" y="40" width="160" height="65" rx="10" fill="#1A2430" stroke="url(#samGrad)" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="65" text-anchor="middle" fill="#22D3EE" font-size="13" font-weight="600">③ Perceive</text>
    <text x="100" y="82" text-anchor="middle" fill="#9FB0C3" font-size="10">SAM 3.1 • chunk+stitch</text>
    <rect x="210" y="40" width="160" height="65" rx="10" fill="#1A2430" stroke="url(#coreGrad)" stroke-width="2" stroke-dasharray="5 3" filter="url(#shadow)"/>
    <text x="290" y="65" text-anchor="middle" fill="#6EA8FF" font-size="13" font-weight="600">④ Timeline</text>
    <text x="290" y="82" text-anchor="middle" fill="#9FB0C3" font-size="10">hold • contact • move</text>
    <rect x="400" y="40" width="160" height="65" rx="10" fill="#1A2430" stroke="url(#wonderGrad)" stroke-width="2" filter="url(#shadow)"/>
    <text x="480" y="65" text-anchor="middle" fill="#F5A524" font-size="13" font-weight="600">⑤ Identify</text>
    <text x="480" y="82" text-anchor="middle" fill="#9FB0C3" font-size="10">1 call per track</text>
    <rect x="210" y="125" width="160" height="55" rx="10" fill="#1A2430" stroke="url(#coreGrad)" stroke-width="2" stroke-dasharray="5 3" filter="url(#shadow)"/>
    <text x="290" y="150" text-anchor="middle" fill="#6EA8FF" font-size="13" font-weight="600">Segmentation</text>
    <text x="290" y="167" text-anchor="middle" fill="#9FB0C3" font-size="10">1-20 s action chunks</text>
    <line x1="180" y1="72" x2="208" y2="72" stroke="#5B7189" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="370" y1="72" x2="398" y2="72" stroke="#5B7189" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="290" y1="105" x2="290" y2="123" stroke="#5B7189" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- Arrow: Ingest to Perceive -->
  <path d="M 565 255 L 565 350 L 150 350 L 150 410" fill="none" stroke="#5B7189" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- REASONING SECTION -->
  <g transform="translate(680, 370)">
    <rect x="0" y="0" width="670" height="200" rx="14" fill="none" stroke="#F5A524" stroke-width="1" stroke-dasharray="6 4" opacity="0.3"/>
    <text x="16" y="22" fill="#F5A524" font-size="12" font-weight="600" letter-spacing="2" opacity="0.7">REASONING</text>
    <rect x="20" y="40" width="150" height="65" rx="10" fill="#1A2430" stroke="url(#wonderGrad)" stroke-width="2" filter="url(#shadow)"/>
    <text x="95" y="65" text-anchor="middle" fill="#F5A524" font-size="13" font-weight="600">⑥ Score</text>
    <text x="95" y="82" text-anchor="middle" fill="#9FB0C3" font-size="10">step likelihoods</text>
    <rect x="200" y="40" width="150" height="65" rx="10" fill="#1A2430" stroke="url(#coreGrad)" stroke-width="2" stroke-dasharray="5 3" filter="url(#shadow)"/>
    <text x="275" y="65" text-anchor="middle" fill="#6EA8FF" font-size="13" font-weight="600">⑦ Align</text>
    <text x="275" y="82" text-anchor="middle" fill="#9FB0C3" font-size="10">constrained DP</text>
    <rect x="200" y="125" width="150" height="55" rx="10" fill="#1A2430" stroke="url(#coreGrad)" stroke-width="2" stroke-dasharray="5 3" filter="url(#shadow)"/>
    <text x="275" y="150" text-anchor="middle" fill="#6EA8FF" font-size="12" font-weight="600">Deviations</text>
    <text x="275" y="167" text-anchor="middle" fill="#9FB0C3" font-size="10">missed • order • tool</text>
    <rect x="380" y="40" width="140" height="65" rx="10" fill="#1A2430" stroke="url(#wonderGrad)" stroke-width="2" filter="url(#shadow)"/>
    <text x="450" y="65" text-anchor="middle" fill="#F5A524" font-size="13" font-weight="600">⑧ Verify</text>
    <text x="450" y="82" text-anchor="middle" fill="#9FB0C3" font-size="10">independent 2nd look</text>
    <rect x="530" y="40" width="120" height="65" rx="10" fill="#1A2430" stroke="url(#wonderGrad)" stroke-width="2" filter="url(#shadow)"/>
    <text x="590" y="65" text-anchor="middle" fill="#F5A524" font-size="12" font-weight="600">Explain</text>
    <text x="590" y="82" text-anchor="middle" fill="#9FB0C3" font-size="10">≤ 40 words</text>
    <line x1="170" y1="72" x2="198" y2="72" stroke="#5B7189" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="350" y1="72" x2="378" y2="72" stroke="#5B7189" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="520" y1="72" x2="528" y2="72" stroke="#5B7189" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="275" y1="105" x2="275" y2="123" stroke="#5B7189" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- Arrow: Segments to Score -->
  <line x1="420" y1="525" x2="698" y2="440" stroke="#5B7189" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- OUTPUT SECTION -->
  <g transform="translate(50, 610)">
    <rect x="0" y="0" width="1300" height="200" rx="14" fill="none" stroke="#4ADE80" stroke-width="1" stroke-dasharray="6 4" opacity="0.3"/>
    <text x="16" y="22" fill="#4ADE80" font-size="12" font-weight="600" letter-spacing="2" opacity="0.7">EVIDENCE, ILLUSTRATION, OUTPUT</text>
    <rect x="20" y="45" width="180" height="65" rx="10" fill="#1A2430" stroke="url(#coreGrad)" stroke-width="2" stroke-dasharray="5 3" filter="url(#shadow)"/>
    <text x="110" y="70" text-anchor="middle" fill="#6EA8FF" font-size="13" font-weight="600">⑨ Evidence</text>
    <text x="110" y="87" text-anchor="middle" fill="#9FB0C3" font-size="10">real frames + masks</text>
    <rect x="230" y="45" width="180" height="65" rx="10" fill="#1A2430" stroke="url(#imageGrad)" stroke-width="2" filter="url(#shadow)"/>
    <text x="320" y="70" text-anchor="middle" fill="#FB7185" font-size="13" font-weight="600">⑩ Illustrate</text>
    <text x="320" y="87" text-anchor="middle" fill="#9FB0C3" font-size="10">Muse Image + QA</text>
    <rect x="550" y="45" width="180" height="65" rx="10" fill="#1A2430" stroke="url(#outputGrad)" stroke-width="2" filter="url(#shadow)"/>
    <text x="640" y="70" text-anchor="middle" fill="#4ADE80" font-size="13" font-weight="600">⑪ Report</text>
    <text x="640" y="87" text-anchor="middle" fill="#9FB0C3" font-size="10">report.json + manifest</text>
    <rect x="780" y="45" width="180" height="65" rx="10" fill="#1A2430" stroke="url(#outputGrad)" stroke-width="2" filter="url(#shadow)"/>
    <text x="870" y="70" text-anchor="middle" fill="#4ADE80" font-size="13" font-weight="600">HTML / PDF</text>
    <text x="870" y="87" text-anchor="middle" fill="#9FB0C3" font-size="10">self-contained report</text>
    <rect x="1010" y="45" width="260" height="65" rx="10" fill="#1A2430" stroke="url(#outputGrad)" stroke-width="2" filter="url(#shadow)"/>
    <text x="1140" y="70" text-anchor="middle" fill="#4ADE80" font-size="13" font-weight="600">⑫ Review UI</text>
    <text x="1140" y="87" text-anchor="middle" fill="#9FB0C3" font-size="10">video + timeline + deviations + overlay</text>
    <line x1="200" y1="77" x2="548" y2="77" stroke="#5B7189" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="410" y1="77" x2="548" y2="77" stroke="#5B7189" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="730" y1="77" x2="778" y2="77" stroke="#5B7189" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="960" y1="77" x2="1008" y2="77" stroke="#5B7189" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="160" y="135" fill="#9FB0C3" font-size="10" font-style="italic">⑨ and ⑩ run in parallel after Verify</text>
    <rect x="230" y="115" width="180" height="28" rx="6" fill="#FB718520" stroke="#FB7185" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="320" y="134" text-anchor="middle" fill="#FB7185" font-size="10" font-weight="600">WATERMARK REQUIRED</text>
    <rect x="20" y="115" width="180" height="28" rx="6" fill="#6EA8FF20" stroke="#6EA8FF" stroke-width="1"/>
    <text x="110" y="134" text-anchor="middle" fill="#6EA8FF" font-size="10" font-weight="600">sha256 + phash verify</text>
    <rect x="550" y="135" width="410" height="42" rx="8" fill="#1A2430" stroke="#5B7189" stroke-width="1"/>
    <text x="755" y="155" text-anchor="middle" fill="#9FB0C3" font-size="11" font-weight="500">SSE Progress Stream — stage/cost/elapsed</text>
    <text x="755" y="170" text-anchor="middle" fill="#6EA8FF" font-size="10">GET /runs/{id}/events</text>
  </g>

  <!-- Arrow: Deviations to Evidence -->
  <path d="M 975 550 L 975 580 L 110 580 L 110 655" fill="none" stroke="#5B7189" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Arrow: Deviations to Illustrate -->
  <path d="M 975 555 L 975 585 L 320 585 L 320 655" fill="none" stroke="#5B7189" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Client Layer -->
  <g transform="translate(50, 850)">
    <rect x="0" y="0" width="1300" height="80" rx="12" fill="#1A2430" stroke="#2A3A4D" stroke-width="1"/>
    <text x="650" y="24" text-anchor="middle" fill="#E6EDF3" font-size="14" font-weight="600">pw.clients — Model API Abstraction Layer</text>
    <rect x="30" y="38" width="180" height="30" rx="6" fill="#22D3EE15" stroke="#22D3EE" stroke-width="1"/>
    <text x="120" y="58" text-anchor="middle" fill="#22D3EE" font-size="11" font-weight="500">live | replay | fake</text>
    <rect x="240" y="38" width="180" height="30" rx="6" fill="#F5A52415" stroke="#F5A524" stroke-width="1"/>
    <text x="330" y="58" text-anchor="middle" fill="#F5A524" font-size="11" font-weight="500">3 retries + backoff</text>
    <rect x="450" y="38" width="180" height="30" rx="6" fill="#6EA8FF15" stroke="#6EA8FF" stroke-width="1"/>
    <text x="540" y="58" text-anchor="middle" fill="#6EA8FF" font-size="11" font-weight="500">cost ledger per call</text>
    <rect x="660" y="38" width="180" height="30" rx="6" fill="#FB718515" stroke="#FB7185" stroke-width="1"/>
    <text x="750" y="58" text-anchor="middle" fill="#FB7185" font-size="11" font-weight="500">key redaction</text>
    <rect x="870" y="38" width="200" height="30" rx="6" fill="#4ADE8015" stroke="#4ADE80" stroke-width="1"/>
    <text x="970" y="58" text-anchor="middle" fill="#4ADE80" font-size="11" font-weight="500">request-hash cache</text>
    <rect x="1100" y="38" width="170" height="30" rx="6" fill="#A78BFA15" stroke="#A78BFA" stroke-width="1"/>
    <text x="1185" y="58" text-anchor="middle" fill="#A78BFA" font-size="11" font-weight="500">PW_SPEND_CAP_USD</text>
  </g>

  <!-- Run Store -->
  <g transform="translate(50, 955)">
    <rect x="0" y="0" width="1300" height="50" rx="10" fill="#1A2430" stroke="#2A3A4D" stroke-width="1"/>
    <text x="650" y="20" text-anchor="middle" fill="#E6EDF3" font-size="13" font-weight="600">Filesystem Run Store — runs/&lt;run_id&gt;/</text>
    <text x="650" y="40" text-anchor="middle" fill="#9FB0C3" font-size="11">input/ • stages/ • media/ • evidence/ • illustrations/ • report.json • manifest.json • ledger.json</text>
  </g>

  <!-- Domain Guard -->
  <g transform="translate(1100, 475)">
    <rect x="0" y="0" width="200" height="65" rx="8" fill="#F8717120" stroke="#F87171" stroke-width="1.5"/>
    <text x="100" y="22" text-anchor="middle" fill="#F87171" font-size="12" font-weight="600">Domain Guard</text>
    <text x="100" y="40" text-anchor="middle" fill="#9FB0C3" font-size="10">coverage &lt; 0.3 →</text>
    <text x="100" y="55" text-anchor="middle" fill="#F87171" font-size="10" font-weight="500">procedure_not_recognized</text>
  </g>

  <!-- Confidence -->
  <g transform="translate(1100, 550)">
    <rect x="0" y="0" width="200" height="50" rx="8" fill="#94A3B820" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="100" y="22" text-anchor="middle" fill="#94A3B8" font-size="12" font-weight="600">Confidence Routing</text>
    <text x="100" y="42" text-anchor="middle" fill="#9FB0C3" font-size="10">flagged | needs_review | dropped</text>
  </g>
</svg>
